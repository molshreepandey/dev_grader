[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Internal crates
grader-types = { path = "crates/grader-types" }
report-parser = { path = "crates/report-parser" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
