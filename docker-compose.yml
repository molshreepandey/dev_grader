# Deployment for the assignment autograder.
#
#   docker compose up -d grader                    # server: use the existing LamiCons Kafka
#   docker compose --profile local up -d           # laptop: also start a throwaway Kafka
#   docker compose run --rm grader grade-local py-fibonacci /opt/examples/students/py-fibonacci-good
#
# The worker is a pure Kafka consumer/producer — it exposes no port.

services:
  grader:
    image: ${GRADER_IMAGE:-ghcr.io/lamicons-enterprise/lamicons-dev-engine:prod}
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    restart: unless-stopped

    # The sandbox creates user/PID/net/mount namespaces and writes cgroup v2 limits under
    # /sys/fs/cgroup, which Docker mounts read-only for an unprivileged container. Without this
    # every grade fails to spawn. The untrusted code is still confined — by the namespaces,
    # cgroups and seccomp the sandbox sets up itself, one layer *inside* this container.
    privileged: true

    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-grader-workers}
      SUBMISSION_TOPIC: ${SUBMISSION_TOPIC:-assignment-submission}
      RESULT_TOPIC: ${RESULT_TOPIC:-assignment-result}
      GRADER_CONCURRENCY: ${GRADER_CONCURRENCY:-4}
      RUST_LOG: ${RUST_LOG:-info}

    volumes:
      # Assignments are data, not code: add or edit one — dependencies included — and restart. The
      # image holds only the toolchain; every project's dependencies are installed per submission.
      - ./assignments:/opt/assignments:ro
      # Only so `grade-local` can grade the checked-in examples. Drop this line in production.
      - ./examples:/opt/examples:ro

    # Per-submission scratch (student checkout, merged workspace, assembled mount-namespace root)
    # lives on the container's writable layer at WORK_ROOT, and is deleted after each grade. Swap
    # it for a tmpfs if the host has RAM to spare — Maven's target/ makes this disk-heavy:
    #   tmpfs: ["/tmp/grader:exec,mode=1777,size=4g"]

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Local-only Kafka. On the server the grader talks to the Kafka the Java services already use:
  # set KAFKA_BROKERS and leave this profile off.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["local"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
